apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app.kubernetes.io/name: ra-clip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ra-clip
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
