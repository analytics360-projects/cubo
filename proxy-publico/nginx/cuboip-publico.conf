# Proxy público de CuboIP (VM inf-proxy-cuboip-01, 10.19.5.242).
# Internet → Cloudflare (proxy naranja, SSL Full strict) → NAT 443/80 → esta VM → sistemas internos.
# Un solo dominio (cubo.servicios360.com.mx); la ruta decide el sistema: / horus, /api amon,
# /analitica Superset, /s3 MinIO.
# Se instala en /etc/nginx/conf.d/. Las IPs reales de Cloudflare están en cloudflare-realip.conf
# (lo regenera /usr/local/sbin/cloudflare-ips.sh).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Ruta cruda para MinIO sin el prefijo /s3: la firma S3 cubre la ruta exacta (con "//" y %XX),
# y rewrite/proxy_pass con URI usarían la ruta normalizada.
map $request_uri $s3_uri { ~^/s3(?<resto>/.*)$ $resto; default /; }

# --- Backends. Para balancear, agrega más "server" a cada upstream. ---
# Staging 10.19.5.244 (docker compose -p cuboip). Al pasar a microk8s: horus NodePort 32000/32100,
# amon NodePort 32003 en cada nodo.
upstream cuboip_horus {
    server 10.19.5.244:7143 max_fails=3 fail_timeout=15s;
    keepalive 16;
}
upstream cuboip_amon {
    server 10.19.5.244:7101 max_fails=3 fail_timeout=15s;
    keepalive 32;
}
upstream cuboip_s3 {
    server 10.19.5.244:7110 max_fails=3 fail_timeout=15s;
    keepalive 16;
}
upstream cuboip_analitica {
    server 10.19.5.243:443 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

log_format cuboip '$remote_addr [$time_local] $host "$request" $status $body_bytes_sent '
                  '$request_time "$upstream_addr" "$http_user_agent" cf_ray=$http_cf_ray';

ssl_certificate     /etc/nginx/tls/origin.crt;
ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_session_cache   shared:cuboip_ssl:10m;

# Hosts desconocidos o acceso directo por IP: se cierra la conexión sin responder.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# HTTP → HTTPS (Cloudflare también lo hace con "Always Use HTTPS").
server {
    listen 80;
    server_name cubo.servicios360.com.mx;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

# ============ CuboIP: cubo.servicios360.com.mx ============
server {
    listen 443 ssl http2;
    server_name cubo.servicios360.com.mx;
    access_log /var/log/nginx/cuboip-access.log cuboip;

    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Solo lo usa go2rtc dentro del servidor (anónimo con HMAC): nunca desde internet.
    location ^~ /api/VideoInterno { return 403; }

    # amon: REST, WebSocket de video (MSE/WebRTC), webhooks. Se conserva el prefijo /api.
    location /api/ {
        proxy_pass http://cuboip_amon;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Hubs de SignalR (notificaciones y PBX).
    location ~ ^/(notifications|ari)(/|$) {
        proxy_pass http://cuboip_amon;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /health {
        access_log off;
        proxy_pass http://cuboip_amon;
    }

    # Superset (CuboIP Analítica) con SUPERSET_APP_ROOT=/analitica: se pasa la ruta completa.
    # Con "/" final para no atrapar /analiticas-ia de horus.
    location = /analitica { return 301 /analitica/; }
    location ^~ /analitica/ {
        proxy_pass https://cuboip_analitica;
        proxy_ssl_verify off;          # CA interna, red privada
        proxy_set_header Connection "";
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # Superset 6.1 arma las miniaturas sin la subruta (/api/v1/...): no son de amon.
    location ~ ^/api/v1/(chart|dashboard)/[0-9]+/thumbnail/ { return 302 /analitica$request_uri; }

    # MinIO (S3) para las URLs prefirmadas de amon. amon firma contra MINIO_ENDPOINT
    # (minio:9000) y reescribe el origen a /s3; aquí se quita /s3 y se restaura el Host
    # firmado para que la firma cuadre. Solo GET/HEAD: nada se sube desde internet.
    location ^~ /s3/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://cuboip_s3$s3_uri;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # horus se sirve en la raíz (no soporta subruta); /cubo solo redirige.
    location = /cubo  { return 301 /; }
    location ^~ /cubo/ { return 301 /; }

    # horus (front Angular). Su nginx también resuelve /api-carbyne-*, /rapid-prod/.
    location / {
        proxy_pass https://cuboip_horus;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;          # CA interna "CuboIP Desarrollo CA", red privada
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

