# Default values for Skadi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: heberestrada/images
  pullPolicy: IfNotPresent
  # Todos los servicios viven en el repositorio heberestrada/images:
  # el nombre del servicio va dentro del tag, no en el repositorio.
  # Ademas el appVersion del chart es "beta", asi que el tag no puede quedar vacio.
  tag: "skadi_latest"

# ConfigMap del que salen las variables de entorno. Cambia segun el cluster:
# en Centinela es delta-configurations, en Tlaxcala tlaloc-configurations.
# Se sobreescribe por Application de ArgoCD:
#   spec.source.helm.parameters -> configurationsConfigMap
configurationsConfigMap: delta-configurations

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5010

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 64
  targetCPUUtilizationPercentage: 50
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
