server {
    listen 80;
    server_name _;
    # CA de desarrollo de CuboIP para instalar en los equipos cliente.
    location = /ca.crt { root /usr/share/nginx/html; default_type application/x-x509-ca-cert; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /ca.crt { root /usr/share/nginx/html; default_type application/x-x509-ca-cert; }
    location = / { return 302 /superset/welcome/; }

    # Superset exige sesión para el paquete de idioma; el acceso (anónimo) también
    # lo necesita para mostrarse en español. Se extrae de la imagen al desplegar.
    location = /superset/language_pack/es/ {
        root /usr/share/nginx/lang;
        try_files /es.json =404;
        default_type application/json;
    }

    location / {
        proxy_pass http://superset:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
    }
}
