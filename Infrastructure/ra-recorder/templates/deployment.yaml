apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ra-recorder
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # Recreate: dos grabadores sobre el mismo volumen duplicarían segmentos.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ra-recorder
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ra-recorder
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: recorder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.key }}
            - name: DB_SEARCH_PATH
              value: {{ .Values.database.searchPath | quote }}
            - name: GO2RTC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.go2rtc.credentialsSecret }}
                  key: username
            - name: GO2RTC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.go2rtc.credentialsSecret }}
                  key: password
            # $(VAR) lo expande kubernetes con las dos anteriores. La contraseña no
            # debe llevar @ : / ? # % (o debe ir url-encoded).
            - name: MEDIA_RTSP
              value: "rtsp://$(GO2RTC_USER):$(GO2RTC_PASSWORD)@{{ .Values.go2rtc.host }}:{{ .Values.go2rtc.rtspPort }}"
            - name: RECORDINGS_PATH
              value: /data/recordings
            {{- range $k, $v := .Values.config }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: recordings
              mountPath: /data/recordings
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ .Values.recordings.claimName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
