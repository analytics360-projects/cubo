apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amon.fullname" . }}
  labels:
    {{- include "amon.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "amon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "amon.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "amon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostname: hostname
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 300
            timeoutSeconds: 10
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            timeoutSeconds: 10
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: POSTGRESCONNECTIONSTRING
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: postgresconnectionstring
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: aspnetcore_environment
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: aws_secret_access_key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: aws_default_region
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: tz
            - name: NLS_TIMESTAMP_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: nls_timestamp_format
            - name: PBXCONNECTIONSTRING
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbxconnectionstring
            - name: PBX_PORT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbx_port
            - name: PBX_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbx_username
            - name: PBX_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbx_password
            - name: PBX_IP
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbx_ip
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: minio_endpoint
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: minio_access_key_id
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: minio_secret_access_key
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: bucket_name
            - name: STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: storage_type
            - name: REDISCONNECTIONSTRING
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: redisconnectionstring
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: otel_exporter_otlp_endpoint
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: otel_service_name
            - name: OTEL_TRACES_SAMPLER
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: otel_traces_sampler
            - name: OTEL_TRACES_SAMPLER_ARG
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: otel_traces_sampler_arg
            - name: ARI_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: ari_enabled
            - name: ARI_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: ari_app_name
            - name: PRESENCE_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: presence_timezone
            - name: PBX_RECORDINGS_PORT
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: pbx_recordings_port
            # Constructor de reportes: usuario de sólo lectura (amon docs/reportes/crear-usuario-lectura.sql).
            # Opcional: si la llave no existe, amon usa POSTGRESCONNECTIONSTRING en transacción READ ONLY.
            - name: REPORTS_CONNECTIONSTRING
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: reportsconnectionstring
                  optional: true
            # Video (go2rtc interno + esquema vision de los servicios ra). Todo opcional:
            # sin GO2RTC_URL amon funciona como antes (sin proxy de video ni health loop).
            - name: GO2RTC_URL
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: go2rtc_url
                  optional: true
            - name: VISION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: vision_enabled
                  optional: true
            - name: VISION_RTSP_BASE
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: vision_rtsp_base
                  optional: true
            - name: VIDEO_TICKET_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: video_ticket_ttl_seconds
                  optional: true
            - name: VIDEO_MAX_STREAMS_PER_USER
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: video_max_streams_per_user
                  optional: true
            - name: VIDEO_HEALTH_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: video_health_interval_seconds
                  optional: true
            - name: VIDEO_WEBRTC_LEASE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: video_webrtc_lease_seconds
                  optional: true
            - name: VIDEO_ICE_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: video_ice_servers
                  optional: true
            # Credenciales en Secrets, no en el ConfigMap: go2rtc-credentials es el mismo
            # que usan go2rtc y ra. Las URLs RTSP de las cámaras las cifra amon con Data
            # Protection (ICredentialProtector, compartido con Hikvision); su anillo de
            # llaves va en Redis (REDISCONNECTIONSTRING) o en DATAPROTECTION_KEYS_PATH.
            - name: GO2RTC_USER
              valueFrom:
                secretKeyRef:
                  name: go2rtc-credentials
                  key: username
                  optional: true
            - name: GO2RTC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go2rtc-credentials
                  key: password
                  optional: true
            # Opcional: carpeta persistente para el anillo de llaves de Data Protection. Sin
            # ella las llaves van a Redis; si Redis se vacía sin respaldo, las fuentes de
            # video y contraseñas cifradas quedan ilegibles.
            - name: DATAPROTECTION_KEYS_PATH
              valueFrom:
                configMapKeyRef:
                  name: amon-configurations
                  key: dataprotection_keys_path
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
