{{- $gpu := int .Values.gpu.count }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ra-clip
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # Recreate: el PVC de caché es ReadWriteOnce y la GPU no alcanza para dos pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ra-clip
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ra-clip
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      containers:
        - name: clip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CLIP_DEVICE
              value: {{ if gt $gpu 0 }}"cuda"{{ else }}"cpu"{{ end }}
            {{- range $k, $v := .Values.config }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Carga los modelos al arrancar (y los descarga la primera vez): tarda.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /root/.cache
          resources:
            {{- $res := deepCopy .Values.resources }}
            {{- if gt $gpu 0 }}
            {{- $_ := set $res "limits" (merge (dict "nvidia.com/gpu" $gpu) ($res.limits | default dict)) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.cache.claimName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
