{{- if .Values.enabled }}
# Solo ClusterIP: lo usa amon por la red interna; nunca se expone.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app.kubernetes.io/name: ollama
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
{{- end }}
