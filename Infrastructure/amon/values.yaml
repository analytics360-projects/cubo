# Default values for amon (back de CuboIP).
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: heberestrada/images
  pullPolicy: Always
  # Etiqueta que publica Jenkins para la rama main. Sin fijarla, la imagen se
  # resolveria a heberestrada/images:beta (appVersion del chart), que no existe.
  tag: "amon_latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 5001
  targetport: 5001
  # horus llama a la API en el puerto 32003 (src/environments/environment.prod.ts),
  # no en el 32001 que usan los demas back.
  nodeport: 32003
  name: "http"

servicessl:
  type: NodePort
  port: 5002
  targetport: 5002
  nodeport: 32102
  name: "https"

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 2Gi

#replicaCount: 2

# Caché local de cada réplica para grabación y alertas de visión (VISION_CACHE_PATH).
visionCache:
  sizeLimit: 10Gi

# Service ClusterIP adicional por el que go2rtc alcanza a amon (VIDEO_AMON_INTERNAL_URL,
# MJPEG interno de Sense y Milestone). Nombre fijo para que el ConfigMap no dependa del
# nombre del release.
internalService:
  enabled: true
  name: amon-interno

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  #targetCPUUtilizationPercentage: 50
  #targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
