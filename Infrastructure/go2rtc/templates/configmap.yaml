apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "go2rtc.labels" . | nindent 4 }}
data:
  # go2rtc sustituye ${VAR} con variables de entorno al leer el archivo: las
  # credenciales llegan del Secret y no quedan escritas en el ConfigMap.
  # Sin streams fijos: amon los registra por PUT /api/streams (y los vuelve a
  # registrar al arrancar, porque go2rtc no persiste lo que recibe por API).
  go2rtc.yaml: |
    api:
      listen: ":1984"
      username: "${GO2RTC_USER}"
      password: "${GO2RTC_PASSWORD}"
      # Sin origin: el navegador nunca llama a la API de go2rtc (todo pasa por amon).
      origin: ""
    rtsp:
      listen: ":8554"
      username: "${GO2RTC_USER}"
      password: "${GO2RTC_PASSWORD}"
    webrtc:
      listen: ":{{ .Values.webrtc.port }}"
      {{- with .Values.webrtc.candidates }}
      candidates:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webrtc.iceServers }}
      ice_servers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.ffmpegTemplates }}
    ffmpeg:
      {{- range $k, $v := . }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
    {{- end }}
    log:
      level: {{ .Values.logLevel }}
